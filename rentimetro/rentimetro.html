<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <title>Rentimetro</title>
    <link rel="stylesheet" href="css/rentimetro.css?rnd=0">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"    integrity="sha256-9/aliU8dGd2tb6OSsuzixeV4y/faTqgFtohetphbbj0=" crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.js" integrity="sha256-T0Vest3yCU7pafRw9r+settMBX6JkKN06dqBnpQ8d30=" crossorigin="anonymous"></script>
    <script src="js/rentimetro.js?rnd=1"></script>
  </head>
  <body>
    <div class="canvas">
      <div class="main-row">
        <div class="column col-instructions-container">
          <!-- Instructions placeholder: JS code generated here -->
        </div>
        <div class="column col-main">
          <div class="board" style="border: 0px solid red;"><img src="img/pizarron.png"></div>
          <div class="board" id="gearPlaceholder" style="border: 0px solid red;">
            <div class="gear-rail" id="gearScrollingArea">
            </div>
            <div class="ros-reading-line"></div>
          </div>
          <div class="boardElement">
            <!-- SEE: https://css-tricks.com/scale-svg/ -->
            <!-- <img id='board-grid' src="img/grid.svg" style="border: 1px solid red; left: 30%; top: 8.81vh; height: 31vh; width: 24vw"/> -->
            <img id='board-grid' src="img/grid150.png" style="border: 0px solid red; left: 30%; top: 8.81vh; height: 31vh; width: 24vw"/>
          </div>
          <div class="boardElement"><img src="img/base-der.png"></div>
          <div class="boardElement"><img src="img/base-izq.png"></div>
          <div class="boardElement bar" id="idBar"><img src="img/barra.png"></div>
          <div class="boardElement hinge"><img src="img/visagra.png"></div>
          <div class="boardElement" id="bucketBg"><img src="img/cubetaBg.png"></div>
          <div class="boardElement" id="bucketFg"><img src="img/cubetaFrente.png"></div>
          <div class="boardElement" id="water"></div>
          <div class="clickableBucket"></div>
          <div class="boardFloatingElement x-axis y-axis">
            <div>ROE</div>
          </div>
          <div class="boardFloatingElement x-axis">
            <div>ROA</div>
          </div>
          <div class="boardFloatingElement x-axis gear-legend">
            <div>ROS</div>
          </div>
          <div class="boardFloatingElement metric-empuje">
              <div class="metric-box">
                <div class="metric-right gradient-empuje">
                  <div class="metric-name">Empuje</div>
                  <div class="metric-value" id="mu">0.00</div>
                </div>
                <div class="metric-symbol gradient-empuje">&mu;</div>
              </div>
          </div>
        </div>
        <div class="column col-dupont-container">
          <div class="row-dupont-tall">
            <div class="column col-dupont">
              <div class="metric-box">
                <div class="metric-right gradient-utilidad">
                  <div class="metric-name">Utilidad</div>
                  <div class="metric-value" id="utility">100</div>
                </div>
                <div class="metric-symbol gradient-utilidad">&pi;</div>
              </div>
            </div>
            <div class="column col-dupont"></div>
            <div class="column col-dupont">
              <div class="no-metric-box">
                <div><input id="optNormalize" class="check" type="checkbox" checked="true">Normalizar valores</div>
              </div>
            </div>
            <div class="column col-dupont"></div>
          </div>
          <div class="row-dupont-short">
            <div class="column col-dupont">
              <div class="simple-symbol">=</div>
            </div>
            <div class="column col-dupont"></div>
            <div class="column col-dupont"></div>
            <div class="column col-dupont"></div>
          </div>
          <div class="row-dupont-tall">
            <div class="column col-dupont">
              <div class="metric-box">
                <div class="metric-right gradient-egresos">
                  <div class="metric-name">Egresos</div>
                  <div class="metric-value"><input id="outcome" type="text" value="0.00" disabled></div>
                </div>
                <div class="metric-symbol">&divide;</div>
              </div>
            </div>
            <div class="column col-dupont">
              <div class="metric-box">
                <div class="metric-symbol">=</div>
                <div class="metric-left gradient-ros">
                  <div class="metric-name">ROS</div>
                  <div id="ROS" class="metric-value">100.00</div>
                </div>
              </div>
            </div>
            <div class="column col-dupont"></div>
            <div class="column col-dupont"></div>
          </div>
          <div class="row-dupont-short">
            <div class="column col-dupont">
              <div class="simple-symbol">&minus;</div>
            </div>
            <div class="column col-dupont"></div>
            <div class="column col-dupont"></div>
            <div class="column col-dupont"></div>
          </div>
          <div class="row-dupont-tall">
            <div class="column col-dupont">
              <div class="metric-box">
                <div class="metric-right gradient-ingresos">
                  <div class="metric-name">Ingresos</div>
                  <div class="metric-value"><input id="income" type="text" value="100.00" disabled></div>
                </div>
                <div class="metric-symbol gradient-ingresos">S</div>
              </div>
            </div>
            <div class="column col-dupont">
              <div class="large-symbol">&times;</div>
            </div>
            <div class="column col-dupont">
              <div class="metric-box">
                <div class="metric-symbol">=</div>
                <div class="metric-left gradient-roa">
                  <div class="metric-name">ROA</div>
                  <div class="metric-value" id="ROA">0.00</div>
                </div>
              </div>
            </div>
            <div class="column col-dupont"></div>
          </div>
          <div class="row-dupont-tall">
            <div class="column col-dupont">
              <div class="large-symbol">&divide;</div>
            </div>
            <div class="column col-dupont">
              <div class="metric-box">
                <div class="metric-symbol">=</div>
                <div class="metric-left gradient-tau">
                  <div class="metric-name">&tau;</div>
                  <div class="metric-value" id="tau">0.00</div>
                </div>
              </div>
            </div>
            <div class="column col-dupont">
              <div class="large-symbol">&times;</div>
            </div>
            <div class="column col-dupont">
              <div class="metric-box">
                <div class="metric-symbol">=</div>
                <div class="metric-left gradient-roe">
                  <div class="metric-name">ROE</div>
                  <div class="metric-value" id="ROE1">0.00</div>
                </div>
              </div>
            </div>
          </div>
          <div class="row-dupont-tall">
            <div class="column col-dupont">
              <div class="metric-box">
                <div class="metric-right gradient-inversiones">
                  <div class="metric-name">Inversiones</div>
                  <div class="metric-value"><input id="investment" type="text" value="0.00" disabled></div>
                </div>
                <div class="metric-symbol gradient-inversiones">A</div>
              </div>
            </div>
            <div class="column col-dupont">
              <div class="large-symbol">&times;</div>
            </div>
            <div class="column col-dupont">
              <div class="metric-box">
                <div class="metric-symbol"></div>
                <div class="metric-left gradient-lambda">
                  <div class="metric-name">&lambda;</div>
                  <div class="metric-value" id="lambda1">1.00</div>
                </div>
              </div>
            </div>
            <div class="column col-dupont"></div>
          </div>
          <div class="row-dupont-short">
            <div class="column col-dupont">
              <div class="simple-symbol">&minus;</div>
            </div>
            <div class="column col-dupont"></div>
            <div class="column col-dupont"></div>
            <div class="column col-dupont"></div>
          </div>
          <div class="row-dupont-tall">
            <div class="column col-dupont">
              <div class="metric-box">
                <div class="metric-right gradient-deudas">
                  <div class="metric-name">Deudas</div>
                  <div class="metric-value"><input id="debt" type="text" value="0.00" disabled></div>
                </div>
                <div class="metric-symbol">&divide;</div>
              </div>
            </div>
            <div class="column col-dupont">
              <div class="metric-box">
                <div class="metric-symbol">=</div>
                <div class="metric-left gradient-lambda">
                  <div class="metric-name">&lambda;</div>
                  <div class="metric-value" id="lambda2">1.00</div>
                </div>
              </div>
            </div>
            <div class="column col-dupont">
              <div class="metric-box">
                <div class="metric-symbol">=</div>
                <div class="metric-left gradient-roe">
                  <div class="metric-name">ROE</div>
                  <div class="metric-value" id="ROE2">0.00</div>
                </div>
              </div>
            </div>
            <div class="column col-dupont"></div>
          </div>
          <div class="row-dupont-short">
            <div class="column col-dupont">
              <div class="simple-symbol">=</div>
            </div>
            <div class="column col-dupont">
              <div class="simple-symbol">=</div>
            </div>
            <div class="column col-dupont"></div>
            <div class="column col-dupont"></div>
          </div>
          <div class="row-dupont-tall">
            <div class="column col-dupont">
              <div class="metric-box">
                <div class="metric-right gradient-patrimonio">
                  <div class="metric-name">Patrimonio</div>
                  <div class="metric-value" id="equity">0.00</div>
                </div>
                <div class="metric-symbol gradient-patrimonio">E</div>
              </div>
            </div>
            <div class="column col-dupont">
              <div class="metric-box">
                <div class="metric-symbol"></div>
                <div class="metric-left gradient-roe">
                  <div class="metric-name">ROE</div>
                  <div class="metric-value" id="ROE3">0.00</div>
                </div>
              </div>
            </div>
            <div class="column col-dupont">
            </div>
            <div class="column col-dupont">
              <input type="button" class="button clean-button" value="Limpiar">
            </div>
          </div>
          <div class="row-dupont-tall">
            <div class="column col-dupont"></div>
            <div class="column col-dupont"></div>
          </div>
        </div>
      </div>
      <div class="gearCanvas">

      </div>
    </div>
  </body>
</html>
